name: Release

# Publishes a new version of the app to GitHub Releases. Installed apps find it by themselves
# (auto-update), and it appears in the app under Version Control, where any version can be installed.
#
# It starts by itself in three ways:
#   1. AUTOMATIC: every push / merge to master that changes the app. The version is raised from the
#      commit messages (see "Decide version bump" below), committed, tagged, built and published.
#      Changes that only touch docs (*.md), .github/ or .vscode/ do not release.
#   2. MANUAL: GitHub > Actions > Release > "Run workflow", pick patch / minor / major.
#   3. TAG: push a tag yourself after changing the version:  git tag v1.4.5 && git push origin v1.4.5
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.vscode/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      bump:
        description: How much to raise the version
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# One release at a time; a second push waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # The workflow's own version commit ("release: v1.4.1") must never start another release.
    if: "${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v')) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Automatic run: read the commit messages in this push and choose how far to raise the version.
      #   "feat!:" / "fix!:" or "BREAKING CHANGE"  -> major
      #   "feat:" / "feat(scope):"                 -> minor
      #   anything else                            -> patch
      - name: Decide version bump
        id: decide
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          MESSAGES="$(git log --format='%s%n%b' "$RANGE" || true)"
          BUMP=patch
          if echo "$MESSAGES" | grep -qE '^feat(\(.+\))?:'; then BUMP=minor; fi
          if echo "$MESSAGES" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then BUMP=major; fi
          echo "Commits: $RANGE  ->  bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        if: github.event_name == 'push' && github.ref_type == 'branch'

      # Raise the version, commit it and tag it. (A commit or tag pushed by this workflow does not start
      # another run, so there is no double release.)
      - name: Bump version
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUMP="${{ inputs.bump || steps.decide.outputs.bump }}"
          npm version "$BUMP" -m "release: v%s"
          git push origin HEAD --follow-tags

      # Tag run: the tag must match package.json, otherwise the installer would carry the wrong version.
      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG. Change the version, commit, and tag again."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build installer and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release notes shown to users (GitHub release page and the app's Version Control page). They are plain,
      # friendly sentences, never commit messages. A bigger version bump gets a bigger sentence.
      - name: Add release notes
        continue-on-error: true
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUMP="${{ inputs.bump || steps.decide.outputs.bump }}"
          case "$BUMP" in
            major) printf '%s\n' '- A big update with new features and a better look' '- Faster and smoother to use' '- Bug fixes and improvements' > "$RUNNER_TEMP/notes.md" ;;
            minor) printf '%s\n' '- New features and improvements' '- Smoother, faster performance' '- Bug fixes' > "$RUNNER_TEMP/notes.md" ;;
            *)     printf '%s\n' '- Improved performance and stability' '- Bug fixes and small improvements' > "$RUNNER_TEMP/notes.md" ;;
          esac
          gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
