name: CI

# Builds the app on every pull request, so a broken change shows up as a red check before it is merged.
# (Pushes to master are built by release.yml, which publishes them.) Nothing is published here.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
