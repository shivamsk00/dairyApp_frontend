<div id="preloader">
  <style>
    /* Self-contained: runs before the app's CSS bundle loads. Matches components/ui PageLoader. */
    #preloader {
      background: radial-gradient(60rem 30rem at 50% -10%, hsl(187 85% 45% / .12), transparent), hsl(210 30% 98%);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .sd-pre {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 288px;
      text-align: center;
    }

    .sd-pre-mark {
      position: relative;
      width: 80px;
      height: 80px;
      display: grid;
      place-items: center;
    }

    .sd-pre-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid hsl(187 85% 45% / .16);
      border-top-color: hsl(187 85% 45%);
      border-right-color: hsl(38 92% 56%);
      animation: sd-spin 1s linear infinite;
    }

    .sd-pre-tile {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(155deg, hsl(187 85% 45%), hsl(187 85% 31%));
      box-shadow: 0 8px 22px hsl(187 85% 38% / .38);
      animation: sd-breathe 1.8s ease-in-out infinite;
    }

    .sd-pre-name {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.01em;
      color: hsl(213 22% 11%);
    }

    .sd-pre-label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: hsl(214 18% 36%);
    }

    .sd-pre-track {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 6px;
      border-radius: 9999px;
      background: hsl(187 85% 45% / .16);
    }

    .sd-pre-track::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 30%;
      border-radius: 9999px;
      background: linear-gradient(90deg, hsl(187 85% 45%), hsl(38 92% 56%));
      animation: sd-bar 1.3s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    @keyframes sd-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sd-breathe {
      50% {
        transform: scale(1.06);
      }
    }

    @keyframes sd-bar {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(350%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sd-pre-tile {
        animation: none;
      }

      .sd-pre-ring,
      .sd-pre-track::after {
        animation-duration: 3s;
      }
    }
  </style>
  <div class="sd-pre" role="status" aria-live="polite">
    <div class="sd-pre-mark" aria-hidden="true">
      <span class="sd-pre-ring"></span>
      <span class="sd-pre-tile">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2h8" />
          <path
            d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2" />
          <path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0" />
        </svg>
      </span>
    </div>
    <div>
      <p class="sd-pre-name">Milvo Dairy Solution</p>
      <p class="sd-pre-label">Loading…</p>
    </div>
    <div class="sd-pre-track"></div>
  </div>
</div>
